<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        body{
            background-color: darkcyan;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            height: 100px;
            background-color: brown;
            width: 100px;
            border-radius: 10px;

            transition: background-color transform;
            transition-delay: 0.10s;
            transition-duration: 5s;
            transition-timing-function: linear; /*ease, ease-in, ease-in-out, ease-out, linear*/
        }
        .box:hover{
            background-color:blue;
            transform: scale(1.1);
            transform: translate(40px);
            
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
